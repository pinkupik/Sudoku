# !!! DO NOT EDIT THIS FILE !!!
#
# Contents of this file are cryptographically signed and the signature is validated by CI.
# Even a slight change will make the signature invalid and the CI pipelines will stop working for you.
# If that happens you need to restore the original content of this file.

image:
  name: $CI_REGISTRY/bi-pyt/grading-pipeline-ci:python312
  entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]

variables:
  CONFIG_VERSION: 1

stages:
  - test
  - test-private
  - validate

########################################################################
test-homework01:
  stage: test
  tags:
    - bi-pyt-assignment
  script:
    - cd homework01
    - "gitlab-runner-secrets verify-file-signatures test_*.py"
    - sudo -u nobody pytest -c /etc/config/pytest.ini -s test_trees.py
  only:
    - homework01

test-homework01-private:
  stage: test-private
  tags:
    - bi-pyt-assignment-private
  script:
    - sudo -u nobody pytest -c /etc/config/pytest.ini -v --tb=no --no-summary -rN test_trees_private.py
  only:
    - homework01
  allow_failure: true
  artifacts:
    when: always
    paths:
      - homework01/.test_log.en1

validate-homework01:
  stage: validate
  variables:
    ASSIGNMENT_DEADLINE: "2025-03-17T23:59:59"
  tags:
    - bi-pyt-assignment-validate
  script:
    - cat classification_log.txt
    - stat before_deadline >/dev/null 2>&1
  only:
    - homework01
  dependencies:
    - test-homework01-private
  coverage: '/PASSED_PERCENT=\d+.\d+\%/'

########################################################################
test-homework02:
  stage: test
  tags:
    - bi-pyt-assignment
  script:
    - cd homework02
    - "gitlab-runner-secrets verify-file-signatures tests/*.py tests/*.png"
    - sudo -u nobody pytest -c /etc/config/pytest.ini -s tests/test_filtering.py
  only:
    - homework02

test-homework02-private:
  stage: test-private
  tags:
    - bi-pyt-assignment-private
  script:
    - "gitlab-runner-secrets verify-file-signatures tests/*.png"
    - sudo -u nobody pytest -c /etc/config/pytest.ini -v --tb=no --no-summary -rN tests/test_filtering_private.py
    - sleep 10
  only:
    - homework02
  allow_failure: true
  artifacts:
    when: always
    paths:
      - homework02/.test_log.en1

validate-homework02:
  stage: validate
  variables:
    ASSIGNMENT_DEADLINE: "2025-04-13T23:59:59"
  tags:
    - bi-pyt-assignment-validate
  script:
    - cat classification_log.txt
    - stat before_deadline >/dev/null 2>&1
  only:
    - homework02
  dependencies:
    - test-homework02-private
  coverage: '/PASSED_PERCENT=\d+.\d+\%/'   

########################################################################
test-homework03:
  stage: test
  tags:
    - bi-pyt-assignment
  script:
    - cd homework03
    - "gitlab-runner-secrets verify-file-signatures test_*.py reference_out/*.npz test_images/*.jpg test_images/*.jpeg"
    - sudo -u nobody pytest -c /etc/config/pytest.ini -s test_orb.py
  only:
    - homework03

test-homework03-private:
  stage: test-private
  tags:
    - bi-pyt-assignment-private
  script:
    - sudo -u nobody pytest -c /etc/config/pytest.ini -s -v --tb=no --no-summary -rN test_orb_private.py
    - sleep 10
  only:
    - homework03
  allow_failure: true
  artifacts:
    when: always
    paths:
      - homework03/.test_log.en1

validate-homework03:
  stage: validate
  variables:
    ASSIGNMENT_DEADLINE: "2025-04-27T23:59:59"
  tags:
    - bi-pyt-assignment-validate
  script:
    - cat classification_log.txt
    - stat before_deadline >/dev/null 2>&1
  only:
    - homework03
  dependencies:
    - test-homework03-private
  coverage: '/PASSED_PERCENT=\d+.\d+\%/'

########################################################################
before_script:
  - python3 --version
  - python3 -c "import importlib as il; print('Local modules versions here in CI runner:'); print('\n'.join(f'{(im:=il.import_module(m)).__name__} == {im.__version__}' for m  in ['numpy', 'pylint', 'pytest']));"

