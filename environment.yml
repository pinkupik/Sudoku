name: sudoku-detection
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.12
  
  # Core numerical and scientific computing
  - numpy>=1.24.0
  - scipy>=1.10.0
  
  # Computer vision and image processing
  - opencv-python>=4.8.0
  - scikit-image>=0.21.0
  
  # Machine learning and OCR
  - pytesseract>=0.3.10
  
  # Visualization and plotting
  - matplotlib>=3.7.0
  
  # Utility libraries
  - imutils>=0.5.4
  
  # Jupyter notebook support (for testing and development)
  - jupyter>=1.0.0
  - ipykernel>=6.25.0
  - notebook>=7.0.0
  
  # Development and testing tools
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  
  # Data handling
  - pandas>=2.0.0
  
  # Additional dependencies via pip
  - pip
  - pip:
    # Advanced OCR support (PaddleOCR)
    - paddleocr
    - paddlepaddle
    
    # Additional computer vision utilities
    - pillow>=10.0.0
    
    # Image loading and processing
    - imageio>=2.31.0
    
    # Performance optimization
    - numba>=0.57.0
    
    # Additional utilities that might be needed
    - tqdm>=4.66.0
    - pathlib2>=2.3.7  # For compatibility
    
    # GUI development (if needed for future features)
    - tkinter-page>=0.1.0
    
    # Optional: Enhanced visualization
    - seaborn>=0.12.0
    - plotly>=5.15.0
    
    # Optional: Advanced image processing
    - albumentations>=1.3.0
    
    # Documentation (if needed)
    - sphinx>=7.1.0
    - sphinx-rtd-theme>=1.3.0

# Environment variables and setup
variables:
  TESSDATA_PREFIX: $CONDA_PREFIX/share/tessdata
  OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;udp
  
# Platform-specific notes:
# For Windows users: Install Tesseract OCR separately from https://github.com/UB-Mannheim/tesseract/wiki
# For macOS users: Install Tesseract using: brew install tesseract
# For Linux users: Install Tesseract using: sudo apt-get install tesseract-ocr

# Post-installation setup notes:
# 1. Verify Tesseract installation: tesseract --version
# 2. Check OpenCV installation: python -c "import cv2; print(cv2.__version__)"
# 3. Test PaddleOCR: python -c "from paddleocr import PaddleOCR; print('PaddleOCR OK')"
# 4. Verify all imports: python -c "import cv2, numpy, matplotlib, pytesseract, imutils, skimage; print('All imports OK')"
